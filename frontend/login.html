<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioAcervo — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <div id="app">
    <div class="login-card">
      <h1>🌿 BioAcervo</h1>
      <p>Sistema de Gestão do Herbário Digital</p>
      <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com" autocomplete="username" /></div>
      <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" /></div>
      <div id="login-error" style="color:var(--danger);font-size:.82rem;margin-bottom:12px;display:none"></div>
      <button type="button" class="btn btn-full" id="login-btn" onclick="doLogin()">Entrar</button>

      <div class="login-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="show-register-btn">Criar conta</button>
      </div>

      <div id="register-form" class="register-form" style="display:none;">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="register-nome" placeholder="Seu nome" autocomplete="name" />
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="register-email" placeholder="seu@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="register-senha" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirmar senha</label>
          <input type="password" id="register-confirmar-senha" placeholder="Repita a senha" autocomplete="new-password" />
        </div>
        <div id="register-message" class="register-message" style="display:none"></div>
        <div class="register-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="register-cancel-btn">Voltar</button>
          <button type="button" class="btn btn-sm" id="register-btn" onclick="doRegister()">Cadastrar</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
