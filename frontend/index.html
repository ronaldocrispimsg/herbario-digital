<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BioAcervo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #173028;
        background: #f5f7f2;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(880px, calc(100vw - 32px));
        display: grid;
        gap: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
        font-weight: 800;
      }

      p {
        margin: 0;
        max-width: 680px;
        font-size: 1.1rem;
        line-height: 1.65;
        color: #42524b;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        border: 1px solid #b8c8bd;
        border-radius: 8px;
        padding: 0 16px;
        color: #173028;
        background: #ffffff;
        text-decoration: none;
        font-weight: 700;
      }

      a.primary {
        color: #ffffff;
        background: #226b4d;
        border-color: #226b4d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BioAcervo</h1>
      <p>Sistema de gestão de acervo biológico. A API está disponível no mesmo host por proxy reverso do frontend.</p>
      <nav aria-label="Atalhos">
        <a class="primary" href="/health">Status da API</a>
        <a href="/docs">Swagger</a>
        <a href="/redoc">ReDoc</a>
      </nav>
    </main>
  </body>
</html>
